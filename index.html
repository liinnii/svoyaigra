let cur;
for(let r=0;r<10;r++){const tr=document.createElement("tr");
C.forEach((c,ci)=>{const td=document.createElement("td"),b=document.createElement("button");b.textContent=(r+1)*100;
b.onclick=()=>{if(b.classList.contains("u"))return;cur={b,ci,r};open_()};td.appendChild(b);tr.appendChild(td)});T.appendChild(tr)}
function open_(){const{ci,r}=cur,p=(r+1)*100;$("mc").textContent=C[ci].n;$("mp").textContent=p;
$("mq").textContent=C[ci].q[r][0];$("ma").textContent=C[ci].q[r][1];$("ma").style.display="none";
$("sc").style.display="none";$("sh").style.display="";$("m").classList.add("on")}
$("sh").onclick=()=>{$("ma").style.display="block";$("sh").style.display="none";
const p=(cur.r+1)*100,sc=$("sc");cur.d=[null,null,null];sc.textContent="";
S.forEach((_,i)=>{
 const row=document.createElement("div"),nm=document.createElement("span"),tot=document.createElement("span"),grp=document.createElement("span");
 row.className="row";nm.className="nm";tot.className="tot";grp.className="grp";
 nm.textContent=$("n"+i).value.trim()||"Команда "+(i+1);
 const vals=[p,0,-p],labels=["+"+p,"0","−"+p],cls=["g","z","r"];
 const bs=vals.map((v,k)=>{const b=document.createElement("button");b.type="button";b.className="btn "+cls[k];b.textContent=labels[k];
  b.onclick=()=>{S[i]+=v-(cur.d[i]||0);cur.d[i]=v;$("s"+i).textContent=S[i];upd()};grp.appendChild(b);return b});
 const upd=()=>{tot.textContent="Счёт: "+S[i];row.classList.toggle("chosen",cur.d[i]!==null);
  bs.forEach((b,k)=>{const on=cur.d[i]===vals[k];b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on)})};
 upd();row.append(nm,tot,grp);sc.appendChild(row)});
sc.style.display="block"};
const TOTAL=C.length*10,played=()=>T.querySelectorAll("button.u").length;
function prog(){$("pg").textContent="Сыграно "+played()+" из "+TOTAL}
$("cl").onclick=()=>{if($("ma").style.display==="block")cur.b.classList.add("u");$("m").classList.remove("on");prog();if(played()===TOTAL)results()};
prog();

/* итоги */
let sure=false;
function resetSure(){sure=false;$("rx").textContent="Начать заново"}
function results(){
 resetSure();
 const p=played(),done=p===TOTAL;
 const rows=S.map((s,i)=>({n:$("n"+i).value.trim()||"Команда "+(i+1),s})).sort((a,b)=>b.s-a.s);
 let place=0,prev=null;rows.forEach((o,k)=>{if(o.s!==prev){place=k+1;prev=o.s}o.p=place});
 const top=rows.filter(o=>o.p===1),best=Math.max(1,...S);
 $("rt").textContent=done?"Игра окончена":"Промежуточные итоги";
 $("rw").textContent=p===0?"Игра ещё не началась":top.length>1?(done?"Ничья: ":"Поровну: ")+top.map(o=>o.n).join(", "):(done?"Победитель: ":"Лидирует: ")+top[0].n;
 $("rn").textContent="Сыграно "+p+" из "+TOTAL+" вопросов";
 const L=$("rl");L.textContent="";
 rows.forEach(o=>{const r=document.createElement("div");r.className="rrow"+(o.p===1&&p>0?" p1":"");
  const a=document.createElement("div");a.className="rp";a.textContent=o.p;
  const b=document.createElement("div");b.className="rnm";b.textContent=o.n;
  const c=document.createElement("div");c.className="rs";c.textContent=o.s;
  const d=document.createElement("div");d.className="rbar";const f=document.createElement("i");f.style.width=Math.max(0,o.s)/best*100+"%";d.appendChild(f);
  r.append(a,b,c,d);L.appendChild(r)});
 $("r").classList.add("on");
 try{$("r").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}}
$("go").onclick=results;$("go2").onclick=results;
$("rb").onclick=()=>{resetSure();$("r").classList.remove("on")};
$("rx").onclick=()=>{if(!sure){sure=true;$("rx").textContent="Точно сбросить игру?";return}
 S.fill(0);S.forEach((s,i)=>$("s"+i).textContent=0);T.querySelectorAll("button.u").forEach(b=>b.classList.remove("u"));
 prog();resetSure();$("r").classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("r").classList.remove("on");resetSure()}});
</script></body></html>
